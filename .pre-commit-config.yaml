# Baseline hygiene hooks + stylua. CI (.github/workflows/ci.yml) enforces
# formatting too; this catches it before the commit exists.
# Update deliberately with `pre-commit autoupdate --freeze` and review diffs —
# tags are mutable, so prefer frozen SHAs when bumping.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-case-conflict

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-github # downloads the release binary; no cargo needed

  # selene has no pre-commit mirror, so this is a local hook against the
  # system binary. It skips (with a warning) when selene isn't installed —
  # CI runs it unconditionally, so nothing merges unlinted either way.
  # Install: download from https://github.com/Kampfkarren/selene/releases
  # into ~/.local/bin, or `cargo install selene`.
  - repo: local
    hooks:
      - id: selene
        name: selene (lua lint)
        language: system
        types: [lua]
        entry: bash -c 'command -v selene >/dev/null || { echo "selene not installed — skipping lint (CI will enforce)"; exit 0; }; exec selene "$@"' --
