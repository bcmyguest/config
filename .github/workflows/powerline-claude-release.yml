name: powerline-claude release

# Tag `powerline-claude-vX.Y.Z` to build a static musl binary and publish it
# as a GitHub release. The ansible role downloads the latest release asset.

on:
  push:
    tags: ["powerline-claude-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerline-claude
    steps:
      - uses: actions/checkout@v7

      - name: Install musl target
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test
        run: cargo test

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Name the asset
        run: |
          cp target/x86_64-unknown-linux-musl/release/powerline-claude \
            powerline-claude-x86_64-unknown-linux-musl

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: powerline-claude/powerline-claude-x86_64-unknown-linux-musl
          generate_release_notes: true
