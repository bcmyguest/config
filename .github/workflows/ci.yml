name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stylua:
    name: stylua --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check .

  selene:
    name: selene lint
    runs-on: ubuntu-latest
    env:
      SELENE_VERSION: 0.31.0
    steps:
      - uses: actions/checkout@v7
      - name: Install selene (release binary)
        run: |
          curl -fsSL -o selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -o selene.zip selene
          chmod +x selene
      - name: Lint
        run: ./selene init.lua lua/

  startup:
    name: headless startup smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Link repo as nvim config
        run: |
          mkdir -p ~/.config
          ln -s "$GITHUB_WORKSPACE" ~/.config/nvim

      # Whole data dir: plugin clones (lazy/), built artifacts like
      # telescope-fzf-native, and treesitter parsers (site/). Keyed on the
      # lockfile, so a plugin bump rebuilds the cache; restore-keys still
      # serve the previous cache as a starting point on miss.
      - name: Cache plugins + parsers
        uses: actions/cache@v6
        with:
          path: ~/.local/share/nvim
          key: nvim-data-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}
          restore-keys: |
            nvim-data-${{ runner.os }}-

      - name: Restore plugins from lazy-lock.json
        run: nvim --headless "+Lazy! restore" +qa

      - name: Bare startup produces no errors
        run: |
          out=$(nvim --headless "+lua io.write('STARTUP_OK\n')" +qa 2>&1)
          echo "$out"
          echo "$out" | grep -q STARTUP_OK
          if echo "$out" | grep -Eq "stack traceback|Error detected|E5108"; then
            echo "::error::startup produced errors"; exit 1
          fi

      - name: Opening a file (treesitter + LSP path) produces no errors
        run: |
          out=$(nvim --headless init.lua "+lua vim.wait(1000)" "+lua io.write('FILE_OK\n')" +qa 2>&1)
          echo "$out"
          echo "$out" | grep -q FILE_OK
          if echo "$out" | grep -Eq "stack traceback|Error detected|E5108"; then
            echo "::error::opening a file produced errors"; exit 1
          fi

  powerline-claude:
    name: powerline-claude (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerline-claude
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo registry + build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            powerline-claude/target
          key: powerline-claude-${{ runner.os }}-${{ hashFiles('powerline-claude/Cargo.lock') }}
          restore-keys: |
            powerline-claude-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
