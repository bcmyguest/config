---
- hosts: localhost
  pre_tasks:
    # Fail fast with a readable message instead of dying mid-run inside a role.
    # The per-distro package logic lives in roles/packages; the rest of the
    # roles are distro-agnostic (static GitHub binaries + $HOME installs).
    - name: verify this platform is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['system'] == 'Linux'
          - ansible_facts['os_family'] in ['Debian', 'RedHat', 'Archlinux']
        fail_msg: >-
          Unsupported platform: {{ ansible_facts['distribution'] }}
          ({{ ansible_facts['os_family'] }}/{{ ansible_facts['system'] }}). This playbook supports
          Debian/Ubuntu, Fedora/RHEL and Arch family distros on Linux.
        success_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] | default('') }}
          ({{ ansible_facts['os_family'] }} family) is supported
      tags: [always]

    # Install the galaxy deps in requirements.yml so a fresh clone works with a bare
    # `ansible-playbook nvim.yml` — no separate `ansible-galaxy install` step. Most
    # roles need community.general.github_release, which ships with the full ansible
    # package but not with bare ansible-core. Runs in --check too (the roles below
    # can't even resolve their modules without it), and reports changed only when
    # ansible-galaxy actually installed something rather than on every run.
    - name: install galaxy requirements
      ansible.builtin.command:
        argv: [ansible-galaxy, install, -r, requirements.yml]
      register: galaxy_requirements
      changed_when: "'Installing' in galaxy_requirements.stdout"
      check_mode: false
      tags: [always]
  roles:
    - role: packages
      tags: [packages, apt]  # 'apt' kept as a legacy tag alias
    - role: nvim
      tags: [nvim]
    - role: lua
      tags: [lua]
    - role: uv
      tags: [uv]
    - role: mise
      tags: [mise]
    - role: fnox
      tags: [fnox]
    - role: claude-code
      tags: [claude-code]
    - role: rtk
      tags: [rtk]
    - role: cargo
      tags: [cargo]
    - role: gh
      tags: [gh]
    - role: nerdfonts
      tags: [nerdfonts]
    - role: opencode
      tags: [opencode]
    - role: tree-sitter
      tags: [tree-sitter]
    - role: starship
      tags: [starship]
    - role: ghostty
      tags: [ghostty]
    - role: kitty
      tags: [kitty]
    # starship-claude is retired from the run but its role is kept on disk for
    # reference; powerline-claude owns the Claude Code statusline now and
    # cleans up the artifacts the old role installed.
    - role: powerline-claude
      tags: [powerline-claude]
    # Last: it regenerates shell completions from the binaries the roles above
    # just installed/upgraded, so it must run after them.
    - role: shell-completions
      tags: [shell-completions]
# AI inference (docker, llama-cpp, lemond, openwebui) is opt-in and lives in
# ai-inference.yml, off the default provisioning path.
