---
# Optional, opt-in coding-agent tooling. NOT run by nvim.yml, so a plain
# provisioning run installs only the editor + dev toolchain. Run the whole
# stack explicitly:
#
#   ansible-playbook coding.yml --ask-become-pass
#
# or a single piece via tags, e.g.:
#
#   ansible-playbook coding.yml --tags codegraph --ask-become-pass
#
# Pieces:
#   - docker      docker engine (geerlingguy.docker)
#   - codegraph   local code knowledge graph MCP server for coding agents
#   - milacoder   Mila coding CLI (private GitHub release via gh + npm);
#                 soft-skips when gh has no access to mila-studios/mila-coder.
#                 Needs node/npm/gh from nvim.yml (mise + gh roles).
#   - vscode      Visual Studio Code from Microsoft's apt repo (Debian only).
#   - shell-completions
#                 regenerates shell completions for whatever of the above is
#                 installed; shared with nvim.yml/ai-inference.yml, runs last
#
# grepai lives in ai-inference.yml (needs ollama, which lives alongside the
# rest of the local-model stack).
- hosts: localhost
  pre_tasks:
    # Install the galaxy deps so a fresh clone works with a bare `ansible-playbook
    # coding.yml`, matching nvim.yml.
    - name: install galaxy requirements
      ansible.builtin.command:
        argv: [ansible-galaxy, install, -r, requirements.yml]
      register: galaxy_requirements
      changed_when: "'Installing' in galaxy_requirements.stdout"
      check_mode: false
      tags: [always]

    # geerlingguy.docker is pulled in here rather than listed under `roles:` below.
    # Ansible resolves every `roles:` entry when it LOADS the playbook — before any
    # task runs, and before any earlier play — so a galaxy role named there must
    # already be on disk or the run dies with "the role was not found". include_role
    # resolves at task runtime instead, which is after the install above.
    - name: docker engine
      ansible.builtin.include_role:
        name: geerlingguy.docker
        apply:
          become: true
      tags: [docker]
  roles:
    - role: codegraph
      tags: [codegraph]
    - role: milacoder
      tags: [milacoder]
    - role: vscode
      tags: [vscode]
    # Last, same as in nvim.yml/ai-inference.yml: it regenerates shell completions
    # from the binaries the roles above just installed/upgraded. The role's
    # registry is shared and gated on each tool's binaries being on PATH, so all
    # three playbooks generate the overlap identically and none deletes another's
    # files.
    - role: shell-completions
      tags: [shell-completions]
