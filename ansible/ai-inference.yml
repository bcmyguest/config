---
# Optional, opt-in AI inference stack. NOT run by nvim.yml, so a plain
# provisioning run installs only the editor + dev toolchain. Run the whole
# stack explicitly:
#
#   ansible-playbook ai-inference.yml --ask-become-pass
#
# or a single piece via tags, e.g.:
#
#   ansible-playbook ai-inference.yml --tags lemond --ask-become-pass
#
# Pieces:
#   - docker      docker engine (geerlingguy.docker); lemond/openwebui need it
#   - llama-cpp   llama.cpp server build
#   - lemond      lemonade-server (OpenAI-compatible local LLM serving)
#   - openwebui   chat frontend for lemond/ollama (docker container)
#   - codegraph   local code knowledge graph MCP server for coding agents
#   - grepai      local semantic code search for coding agents; needs ollama
#                 (pulls the nomic-embed-text embedding model)
#
# ollama itself is NOT installed here. If you want it, drop the systemd
# override at ../ollama.service.d/override.conf into the ollama unit by hand.
- hosts: localhost
  pre_tasks:
    # Install the galaxy deps so a fresh clone works with a bare `ansible-playbook
    # ai-inference.yml`, matching nvim.yml.
    - name: install galaxy requirements
      ansible.builtin.command:
        argv: [ansible-galaxy, install, -r, requirements.yml]
      register: galaxy_requirements
      changed_when: "'Installing' in galaxy_requirements.stdout"
      check_mode: false
      tags: [always]

    # geerlingguy.docker is pulled in here rather than listed under `roles:` below.
    # Ansible resolves every `roles:` entry when it LOADS the playbook — before any
    # task runs, and before any earlier play — so a galaxy role named there must
    # already be on disk or the run dies with "the role was not found". include_role
    # resolves at task runtime instead, which is after the install above. Keep it a
    # pre_task: pre_tasks run ahead of `roles:`, preserving docker-before-lemond
    # ordering (lemond and openwebui need the engine up).
    - name: docker engine
      ansible.builtin.include_role:
        name: geerlingguy.docker
        apply:
          become: true
      tags: [docker]
  roles:
    - role: llama-cpp
      tags: [llama-cpp]
    - role: lemond
      tags: [lemond]
      become: true
    - role: openwebui
      tags: [openwebui]
      become: true
    - role: codegraph
      tags: [codegraph]
    - role: grepai
      tags: [grepai]
