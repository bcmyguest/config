# mise (jdx/mise): polyglot tool-version manager. Replaces volta for node and can
# manage python/uv/etc. Ships a single static (musl) binary wrapped in a top-level
# mise/ dir. Tag is "vYYYY.M.D"; the binary reports the bare calver, so the v-prefix
# below makes the comparison line up.
- name: get latest release of mise (cached)
  ansible.builtin.include_role:
    name: github-release-cached
  vars:
    gh_user: jdx
    gh_repo: mise

- name: get current version
  ansible.builtin.command:
    argv:
      - mise
      - --version
  register: current_version
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: extract version
  set_fact:
    current_version: "{{ current_version.stdout_lines[0] | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)', multiline=True) }}"
  check_mode: false
  when:
    - current_version is succeeded and current_version.stdout_lines is defined

- name: extract version
  set_fact:
    current_version: "v{{ current_version }}"
  check_mode: false

- name: Show current version
  debug:
    var: current_version
  when:
    - current_version.rc is not defined

- name: latest release
  debug:
    var: release.tag
  when: release is defined

- name: pinned version
  debug:
    var: pinned_version

- name: set version to install from release
  set_fact:
    version_to_install: "{{ release.tag }}"
  when:
    - pinned_version is not defined
    - release is defined

- name: set version to install from pin
  set_fact:
    version_to_install: "{{ pinned_version }}"
  when:
    - pinned_version is defined

- name: Show version to install
  debug:
    var: version_to_install

- block:
    - name: create temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: mise
      register: tmpdir

    - name: extract release
      ansible.builtin.unarchive:
        src: "https://github.com/jdx/mise/releases/download/{{ version_to_install }}/mise-{{ version_to_install }}-linux-{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'x64' }}-musl.tar.gz"
        dest: "{{ tmpdir.path }}"
        remote_src: true

    # Copy just the binary into ~/.local/bin (on PATH); mode/owner set explicitly
    # because copying out of a tempdir drops the execute bit.
    - name: install mise binary
      ansible.builtin.copy:
        src: "{{ tmpdir.path }}/mise/bin/mise"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise"
        mode: "0755"
        owner: "{{ ansible_facts['user_id'] }}"
  when:
    - not ansible_check_mode
    - version_to_install | default('') | length > 0
    - version_to_install != current_version

# Activation hook installs mise's shims so it actually manages tool versions in new
# bash shells (the equivalent of what `volta` did for node's PATH).
- name: activate mise in shell configuration (bash)
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: 'eval "$(mise activate bash)"'
    create: true

# Global tool pins. `mise use --global` adds each tool to ~/.config/mise/config.toml
# and installs it — creating the config if absent and editing it in place otherwise, so
# it never clobbers tools pinned elsewhere (e.g. claude-code from its own role). These
# are the JS toolchain that used to come from volta (node, bun, pnpm, yarn). Gated on
# the existing config text so re-provisioning is a no-op once a tool is pinned.
- name: read global mise config
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.config/mise/config.toml"
  register: mise_global_config
  failed_when: false

- name: capture the global mise config as text
  ansible.builtin.set_fact:
    mise_global_config_text: "{{ (mise_global_config.content | b64decode) if mise_global_config.content is defined else '' }}"

- name: pin global tools via mise
  ansible.builtin.command:
    argv: [mise, use, --global, "{{ item.spec }}"]
  loop:
    - { name: node, spec: "node@24" }
    - { name: bun, spec: "bun@latest" }
    - { name: pnpm, spec: "pnpm@latest" }
    - { name: yarn, spec: "yarn@latest" }
    # usage (usage.jdx.dev) is a runtime dependency of mise's own shell
    # completions, not a dev tool: `mise completion <shell>` emits a script that
    # shells out to `usage complete-word` on every Tab press and prints an error
    # without it. The shell-completions role gates mise on this binary existing.
    - { name: usage, spec: "usage@latest" }
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in mise_global_config_text
  changed_when: true

- name: hold back tool releases younger than 7 days
  ansible.builtin.command:
    argv: [mise, settings, set, minimum_release_age, "7d"]
  when: "'minimum_release_age' not in mise_global_config_text"
  changed_when: true

# Auto-activate a project's .venv on cd, which is what direnv would otherwise be
# installed to do. mise gates this on a uv.lock being present, so directories that
# aren't uv projects are left alone entirely (no stray .venv, no warning on every
# prompt). "source" only activates an existing .venv and never creates one, so a
# plain `cd` has no side effects — `uv sync` / `uv run` still own venv creation.
# Requires the `mise activate bash` hook above; shims alone don't activate a venv.
- name: auto-activate uv project virtualenvs on cd
  ansible.builtin.command:
    argv: [mise, settings, set, python.uv_venv_auto, "source"]
  when: "'uv_venv_auto' not in mise_global_config_text"
  changed_when: true

# Remove volta now that mise owns node + the JS tooling. Drops its install dir, the
# binaries it left in ~/.local/bin, and the PATH block from the shell rc files. All
# idempotent — re-running with volta already gone is a no-op. Ordered after the tool
# pins above so the mise replacements exist before volta's are taken away.
- name: remove the volta install directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.volta"
    state: absent

- name: remove volta binaries from ~/.local/bin
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item }}"
    state: absent
  loop:
    - volta
    - volta-shim
    - volta-migrate

- name: strip the volta PATH block from shell rc files
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '^if \[ -d "\$HOME/\.volta/bin" \] ; then\n[ \t]*PATH="\$HOME/\.volta/bin:\$PATH"\nfi\n'
    replace: ''
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    - "{{ ansible_facts['env']['HOME'] }}/.profile"
