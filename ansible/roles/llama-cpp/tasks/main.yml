# llama.cpp prebuilt Vulkan binaries. Upstream only ships an x64 ubuntu-vulkan
# tarball, so this role is x86_64-only by design (the glibc-linked build runs
# fine on other distros). Binaries live outside ~/.local/bin (their many .so
# files would clutter it), so the role adds the dir to PATH itself.
- name: llama.cpp prebuilt tarball is x86_64-only
  ansible.builtin.assert:
    that: ansible_facts['architecture'] == 'x86_64'
    fail_msg: >-
      Upstream only publishes the ubuntu-vulkan tarball for x64; this box is
      {{ ansible_facts['architecture'] }}. Build llama.cpp from source or skip the
      llama-cpp tag.

# Upstream now cuts a versioned stable release (v0.4.0) whose only asset is
# nightly-tag.txt naming the blessed build, and marks every per-build bNNNNN tag
# as a prerelease. The GitHub "latest release" API therefore returns v0.4.0, which
# ships no binaries at all -- the old lookup produced a 404 download. Read the
# pointer file instead: no token, no API rate limit, and it names the build
# upstream considers stable.
- name: resolve blessed llama.cpp build tag
  ansible.builtin.uri:
    url: https://github.com/ggml-org/llama.cpp/releases/latest/download/nightly-tag.txt
    return_content: true
  register: llama_cpp_nightly
  check_mode: false
  when: pinned_version is not defined

- name: choose version to install
  ansible.builtin.set_fact:
    version_to_install: "{{ pinned_version if pinned_version is defined else (llama_cpp_nightly.content | trim) }}"
  check_mode: false

# Release tags look like "b10809"; compare the numeric build id so the role is
# idempotent (it once ran a non-existent `llama.cpp` binary and re-downloaded
# every run).
- name: get current llama.cpp version
  ansible.builtin.command:
    argv:
      - "{{ llama_cpp_dir }}/bin/llama-cli"
      - --version
  register: current_version_raw
  failed_when: false
  changed_when: false
  check_mode: false

- name: collect version output
  set_fact:
    llama_version_out: "{{ current_version_raw.stdout ~ '\n' ~ current_version_raw.stderr }}"
  check_mode: false

# Two formats ship in the wild:
#   b10280 and older: "version: 10280 (61881b1f7)"
#   b10809 and newer: "version: 0.4.0-dev (build 10809, commit 5266f24da)"
# Match "build NNNNN" first -- the new format's leading "version: 0" satisfies the
# old pattern and would pin current_build at 0, reinstalling on every run.
- name: extract installed and target build ids
  set_fact:
    current_build: "{{ llama_version_out | regex_search('build\\s+([0-9]+)', '\\1') | default(llama_version_out | regex_search('version:\\s*([0-9]+)', '\\1'), true) | default([], true) | first | default('') }}"
    target_build: "{{ version_to_install | regex_search('[0-9]+') }}"
  check_mode: false

- name: show llama.cpp versions
  debug:
    msg: "installed build={{ current_build | default('none') }} target={{ version_to_install }}"

- name: install llama.cpp
  when:
    - not ansible_check_mode
    - target_build != current_build
    - version_to_install | default('') | length > 0
  block:
    - name: create temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: llama.cpp
      register: tmpdir

    - name: download and extract release
      ansible.builtin.unarchive:
        src: "https://github.com/ggml-org/llama.cpp/releases/download/{{ version_to_install }}/llama-{{ version_to_install }}-bin-ubuntu-vulkan-x64.tar.gz"
        dest: "{{ tmpdir.path }}"
        remote_src: true

    # Wipe first so old library versions (libggml-base.so.0.9.x ...) don't pile up.
    - name: reset llama.cpp bin directory
      ansible.builtin.file:
        path: "{{ llama_cpp_dir }}/bin"
        state: absent

    - name: install binaries
      ansible.builtin.copy:
        src: "{{ tmpdir.path }}/llama-{{ version_to_install }}/"
        dest: "{{ llama_cpp_dir }}/bin/"
        mode: preserve
        owner: "{{ ansible_facts['user_id'] }}"

# Done outside the install block so PATH is ensured even when already up to date.
# (The old `export PATH=...` shell task ran in a throwaway subshell and did nothing.)
- name: add llama.cpp to PATH (bash)
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: 'export PATH="$PATH:{{ llama_cpp_dir }}/bin"'
    create: true
