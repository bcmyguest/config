# Ghostty terminal, installed from the community AppImage
# (pkgforge-dev/ghostty-appimage) — the upstream ghostty-org repo publishes no
# Linux binary. The AppImage is a single self-contained executable dropped at
# ~/.local/bin/ghostty; the config is deployed from files/config.
#
# Note: AppImages need FUSE at runtime. On Debian/Ubuntu that's `libfuse2`;
# add it to roles/packages if `ghostty` fails to launch with a FUSE error.
- name: ghostty AppImage arch is supported
  ansible.builtin.assert:
    that: ansible_architecture in ghostty_arch_map
    fail_msg: >-
      No Ghostty AppImage for {{ ansible_architecture }}; pkgforge-dev publishes
      x86_64 and aarch64 only.

- name: get latest release of ghostty-appimage (cached)
  ansible.builtin.include_role:
    name: github-release-cached
  vars:
    gh_user: pkgforge-dev
    gh_repo: ghostty-appimage

- name: capture release tag
  set_fact:
    release_tag: ""
  when: release is not defined

- name: capture release tag from release
  set_fact:
    release_tag: "{{ release.tag }}"
  when: release is defined

- name: choose version to install
  ansible.builtin.set_fact:
    version_to_install: "{{ pinned_version | default(release_tag) }}"
  check_mode: false

# Asset filenames drop the leading "v" (tag v1.3.1 -> Ghostty-1.3.1-x86_64.AppImage).
- name: build asset name and target version
  ansible.builtin.set_fact:
    ghostty_asset: "Ghostty-{{ version_to_install | regex_replace('^v', '') }}-{{ ghostty_arch_map[ansible_architecture] }}.AppImage"
    target_version: "{{ version_to_install | regex_replace('^v', '') }}"
  check_mode: false

# Probe the installed AppImage explicitly (not whatever `ghostty` resolves to on
# PATH) so idempotency reflects this role's binary. Prints "Ghostty 1.3.1 ...".
- name: get current ghostty version
  ansible.builtin.command:
    argv:
      - "{{ ghostty_bin }}"
      - --version
  register: current_version_raw
  failed_when: false
  changed_when: false
  check_mode: false

- name: extract installed version
  ansible.builtin.set_fact:
    current_version: "{{ current_version_raw.stdout | default('') | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') | default([''], true) | first }}"
  check_mode: false

- name: show ghostty versions
  ansible.builtin.debug:
    msg: "installed={{ current_version | default('none') }} target={{ target_version }}"

- name: install ghostty AppImage
  when:
    - not ansible_check_mode
    - target_version != current_version
    - version_to_install | default('') | length > 0
  block:
    - name: ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.local/bin"
        state: directory
        mode: "0755"

    - name: create temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: ghostty
      register: tmpdir

    - name: download ghostty AppImage
      ansible.builtin.get_url:
        url: "https://github.com/pkgforge-dev/ghostty-appimage/releases/download/{{ version_to_install }}/{{ ghostty_asset }}"
        dest: "{{ tmpdir.path }}/{{ ghostty_asset }}"
        mode: "0755"

    # copy renames atomically on the target, so an interrupted download never
    # leaves a half-written binary at the install path.
    - name: install downloaded AppImage
      ansible.builtin.copy:
        src: "{{ tmpdir.path }}/{{ ghostty_asset }}"
        dest: "{{ ghostty_bin }}"
        mode: "0755"
        remote_src: true

    - name: remove download directory
      ansible.builtin.file:
        path: "{{ tmpdir.path }}"
        state: absent

# Config is deployed regardless of version so keybinding edits land on a re-run
# even when the binary is already current.
- name: ensure ghostty config dir exists
  ansible.builtin.file:
    path: "{{ ghostty_config_dir }}"
    state: directory
    mode: "0755"

- name: deploy ghostty config
  ansible.builtin.copy:
    src: config
    dest: "{{ ghostty_config_dir }}/config"
    mode: "0644"

# Desktop integration so Ghostty shows up in the GNOME/Ubuntu app search. Runs
# every time (not gated on version) so a launcher fix lands on re-run. libfuse2
# (needed to *launch* an AppImage) is provided by roles/packages, not here.
- name: ensure desktop-entry and icon dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ghostty_applications_dir }}"
    - "{{ ghostty_icon_dir }}"

- name: install ghostty app icon
  ansible.builtin.copy:
    src: com.mitchellh.ghostty.png
    dest: "{{ ghostty_icon_dir }}/com.mitchellh.ghostty.png"
    mode: "0644"
  register: ghostty_icon

- name: install ghostty desktop entry
  ansible.builtin.template:
    src: com.mitchellh.ghostty.desktop.j2
    dest: "{{ ghostty_applications_dir }}/com.mitchellh.ghostty.desktop"
    mode: "0644"
  register: ghostty_desktop

- name: refresh desktop database
  ansible.builtin.command:
    cmd: update-desktop-database {{ ghostty_applications_dir }}
  changed_when: false
  failed_when: false
  when: ghostty_desktop is changed

- name: refresh icon cache
  ansible.builtin.command:
    cmd: gtk-update-icon-cache -f -t {{ ansible_env.HOME }}/.local/share/icons/hicolor
  changed_when: false
  failed_when: false
  when: ghostty_icon is changed
