---
# Where the AppImage lands. ~/.local/bin is already on PATH (XDG default), so
# unlike llama-cpp this role needs no PATH edit.
ghostty_bin: "{{ ansible_env.HOME }}/.local/bin/ghostty"
ghostty_config_dir: "{{ ansible_env.HOME }}/.config/ghostty"

# pkgforge-dev names its assets by CPU arch; ansible_architecture already uses
# the same tokens, but map explicitly so an unexpected arch fails loudly rather
# than building a bogus URL.
ghostty_arch_map:
  x86_64: x86_64
  aarch64: aarch64
