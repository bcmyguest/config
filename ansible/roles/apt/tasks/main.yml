---
# Third-party repos via built-in modules: deb822_repository fetches + dearmors the
# signing key and writes a Signed-By .sources; apt_repository handles PPAs and
# their Launchpad keys. No manual gpg, keyserver, or NO_PUBKEY parsing.

# deb822_repository parses sources with python-debian, which must live in the
# interpreter ansible runs modules under (the pipx venv) — install it there.
- name: ensure python-debian is available to ansible (deb822_repository dependency)
  ansible.builtin.pip:
    name: python-debian
    state: present

# Pin repos to this machine's real arch so amd64-only repos stop emitting i386
# acquire warnings when i386 is a foreign arch. Derived, not hardcoded.
- name: detect the system dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: manage vendor deb822 repositories
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: deb
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components | default(omit) }}"
    architectures: "{{ dpkg_arch.stdout }}"
    signed_by: "{{ item.signed_by }}"
    state: present
  become: true
  loop: "{{ apt_repos }}"
  loop_control:
    label: "{{ item.name }}"

# Remove deb822 .sources no longer managed here: chromium-beta has no noble build,
# and graphics-drivers is now a PPA (next task), which writes its own list + key.
- name: remove superseded deb822 sources
  ansible.builtin.deb822_repository:
    name: "{{ item }}"
    state: absent
  become: true
  loop:
    - chromium-beta
    - graphics-drivers

# Manual installs (or pre-deb822 runs) leave legacy entries that declare these same
# repos with a different Signed-By key path. apt then refuses to read EVERY source:
# "Conflicting values set for option Signed-By". The deb822 .sources written above are
# now canonical, so strip every other reference to a managed repo URL from within the
# run itself:
#   * any file in sources.list.d that names a managed URL but is not that repo's
#     canonical <name>.sources  -> deleted (it is a leftover per-repo dup file);
#   * matching lines in the monolithic /etc/apt/sources.list -> commented out.
# Match on the full URL path (scheme/trailing slash stripped), not just the host, so a
# different repo on the same host (e.g. vscode on packages.microsoft.com) is untouched.
# Keyrings are never removed: a key with no source is inert and some are shared.
- name: find legacy source files duplicating deb822-managed repos
  ansible.builtin.shell:
    cmd: >-
      grep -rIlF
      {% for r in apt_repos %}-e '{{ r.uris | regex_replace('^https?://', '') | regex_replace('/$', '') }}' {% endfor %}
      /etc/apt/sources.list.d/ 2>/dev/null
      | grep -vxE '{% for r in apt_repos %}/etc/apt/sources\.list\.d/{{ r.name }}\.sources{% if not loop.last %}|{% endif %}{% endfor %}'
      || true
  register: legacy_apt_sources
  changed_when: false

- name: remove legacy per-repo source files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ legacy_apt_sources.stdout_lines }}"

- name: check for a monolithic /etc/apt/sources.list
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: monolithic_sources

- name: comment out legacy entries inside /etc/apt/sources.list
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: >-
      ^(\s*deb(?:-src)?\s+.*(?:{{ apt_repos | map(attribute='uris') | map('regex_replace', '^https?://', '') | map('regex_replace', '/$', '') | map('regex_escape') | join('|') }}).*)$
    replace: '# \1  # disabled by ansible: duplicates a deb822-managed repo'
  become: true
  when: monolithic_sources.stat.exists

- name: manage Launchpad PPAs (signing key installed automatically)
  ansible.builtin.apt_repository:
    repo: "ppa:{{ item }}"
    state: present
  become: true
  loop: "{{ apt_ppas }}"

- name: install apt packages
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: latest
    update_cache: true
    cache_valid_time: 3600
  become: true
