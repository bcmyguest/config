---
packages:
  - build-essential
  - libreadline-dev
  - unzip
  - ripgrep
  - vim
  - make
  - cmake
  - curl
  - btop
  - ca-certificates
  - tilix
  - mesa-utils
  - nvtop
  # - grub-customizer # For managing GRUB bootloader
  - libfuse2t64 # requires universe apt-repo `sudo add-apt-repository universe`
  - keychain
  - tree
  - git
  - xclip

# Self-healing third-party apt repos. Every run re-fetches the signing key into
# /etc/apt/keyrings/<name>.gpg and writes a deb822 .sources file pinned to it via
# Signed-By, so missing / expired / rotated keys repair themselves and the legacy
# trusted.gpg (apt-key) deprecation warning goes away. The matching legacy .list
# (if any) is removed to avoid "E:Conflicting values set for option Signed-By".
#
# These repos are installed on EVERY box this role runs against — trim the list
# to what a given machine should actually have.
#
# Flat repo: omit `components` and set `suites: "/"` (e.g. kubernetes).
# Launchpad PPA: give `ppa: owner/name` instead of `key_url`; the signing-key
# fingerprint is resolved from the Launchpad API at runtime (no hardcoding).
#
# OS codename/version come from gathered facts, not literals, so the same list
# works on jammy/noble/etc:
#   {{ ansible_distribution_release }}  -> jammy, noble, ...
#   {{ ansible_distribution_version }}  -> 22.04, 24.04, ...
# (spotify's `stable` is its own suite, not an OS codename; kubernetes `v1.28` is
# a k8s version — both stay literal.)
apt_repos:
  # The pubkey_<KEYID>.gpg filename is Spotify's own convention (no "latest"
  # alias); the id below is the one published at https://www.spotify.com/download/linux/.
  # If Spotify rotates the key, apt errors NO_PUBKEY with the new id — read it off
  # `dists/stable/InRelease` (gpg --list-packets shows the issuer keyid) and bump it.
  - name: spotify
    key_url: https://download.spotify.com/debian/pubkey_6224F9941A8AA6D1.gpg
    uri: https://repository.spotify.com
    suites: stable
    components: non-free

  - name: microsoft-prod
    key_url: https://packages.microsoft.com/keys/microsoft.asc
    uri: "https://packages.microsoft.com/ubuntu/{{ ansible_distribution_version }}/prod"
    suites: "{{ ansible_distribution_release }}"
    components: main

  - name: kubernetes
    key_url: https://pkgs.k8s.io/core:/stable:/v1.28/deb/Release.key
    uri: https://pkgs.k8s.io/core:/stable:/v1.28/deb/
    suites: "/"

  - name: chromium-beta
    ppa: saiarcot895/chromium-beta
    uri: https://ppa.launchpadcontent.net/saiarcot895/chromium-beta/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main

  - name: graphics-drivers
    ppa: graphics-drivers/ppa
    uri: https://ppa.launchpadcontent.net/graphics-drivers/ppa/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: main
