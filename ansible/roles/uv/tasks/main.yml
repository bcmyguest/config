- name: set uv target triple for this architecture
  set_fact:
    uv_target: "uv-{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}-unknown-linux-musl"
  check_mode: false

- name: get latest release of uv (cached)
  ansible.builtin.include_role:
    name: github-release-cached
  vars:
    gh_user: astral-sh
    gh_repo: uv
- name: extract version from release
  set_fact:
    current_release: "{{ release.tag | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)', multiline=True) }}"
  check_mode: false
  when:
    - release is defined
    - release is succeeded

- name: get current version
  ansible.builtin.command:
    argv:
      - uv
      - --version
  register: current_version
  ignore_errors: true
  changed_when: false
  check_mode: false

- name: extract version
  set_fact:
    current_version: "{{ current_version.stdout_lines[0] | regex_search('([0-9]+\\.[0-9]+\\.[0-9]+)', multiline=True) }}"
  check_mode: false
  when:
    - current_version is succeeded and current_version.stdout_lines is defined

- name: extract version
  set_fact:
    current_version: "v{{ current_version }}"
  check_mode: false

- name: Show current version
  debug:
    var: current_version
  when:
    - current_version.rc is not defined

- name: latest release
  debug:
    var: release.tag
  when: release is defined

- name: pinned version
  debug:
    var: pinned_version

# should be either release.tag or neovim_pinned_version
- name: set version to install from release
  set_fact:
    version_to_install: "{{ release.tag }}"
  when:
    - pinned_version is not defined
    - release is defined

- name: version_to_install
  debug:
    var: version_to_install

- name: set version to install
  set_fact:
    version_to_install: "{{ pinned_version }}"
  when:
    - pinned_version is defined

- name: Show version to install
  debug:
    var: version_to_install
- name: Installed correct version
  debug:
    var: version_to_install != current_version
- block:
    - name: create temporary download directory
      ansible.builtin.tempfile:
        state: directory
        suffix: uv
      register: tmpdir
    - name: show tmpdir
      debug:
        var: tmpdir

    - name: extract binary
      ansible.builtin.unarchive:
        src: "https://github.com/astral-sh/uv/releases/download/{{ version_to_install }}/{{ uv_target }}.tar.gz"
        dest: "{{ tmpdir.path }}"
        mode: "0755"
        remote_src: true
    - name: copy binaries
      ansible.builtin.copy:
        src: "{{ tmpdir.path }}/{{ uv_target }}/"
        dest: "{{ ansible_env.HOME }}/.local/bin"
        mode: preserve
        owner: "{{ ansible_user_id }}"
  when:
    - not ansible_check_mode
    - version_to_install | default('') | length > 0
    - version_to_install != current_version

# uv tool install places executables in ~/.local/bin; ensure that directory is
# on the shell PATH so tools (prek, etc.) are callable directly without `uvx`.
- name: ensure uv tool executables are on PATH
  ansible.builtin.command:
    cmd: uv tool update-shell
  changed_when: false
  check_mode: false
