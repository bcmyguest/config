# =============================================================================
# Tilix-matching keybindings for kitty
# Mapping: Tilix "session" = kitty tab, Tilix "terminal" = kitty window (split).
# Mirrors roles/ghostty/files/config bind-for-bind; kitty-only extras that were
# the reason for switching (numbered split jump, broadcast) are marked NEW.
# kitty.conf syntax: `map <keys> <action>`; comments must be on their own line.
# =============================================================================

# The splits layout is what gives Tilix-style arbitrary splits; stack is second
# so ctrl+shift+x can zoom the focused split (Tilix terminal-maximize).
enabled_layouts splits,stack

# --- Font ---
# Nerd Font is required for starship prompt glyphs: ghostty bundles the
# symbols, kitty does not, so its default monospace shows broken boxes.
# Family/weight/size match the old Tilix profile (JetBrainsMonoNL Light 12,
# non-Propo variant since kitty needs a fixed cell grid).
font_family family="JetBrainsMonoNL Nerd Font" style=Light
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# --- Application / tabs (Tilix "sessions") ---
# Show each tab's number in the tab bar so ctrl+alt+N jumps are predictable
# ({index} is 1-based, the same numbering goto_tab uses).
tab_title_template "{index}: {title}"
# app-new-session (kitty default)
map ctrl+shift+t new_tab
# app-new-window
map ctrl+shift+n new_os_window
# session-close (kitty default)
map ctrl+shift+q close_tab
# win-switch-to-next/previous-session
map ctrl+page_down next_tab
map ctrl+page_up previous_tab
# win-reorder-next/previous-session
map ctrl+shift+page_down move_tab_forward
map ctrl+shift+page_up move_tab_backward
# win-switch-to-session-1..9 (goto_tab is 1-based; 0 means previous tab)
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9

# --- Splits (Tilix "terminals" within a session) ---
# session-add-right / -down / -auto; --cwd=current inherits the working dir
# like Tilix. kitty naming: vsplit = side by side, hsplit = one above the other.
map ctrl+alt+r launch --location=vsplit --cwd=current
map ctrl+alt+d launch --location=hsplit --cwd=current
map ctrl+alt+a launch --location=split --cwd=current
# terminal-close (kitty default; closes immediately, no confirm prompt)
map ctrl+shift+w close_window
# terminal-maximize — toggle into the stack layout to zoom the focused split
map ctrl+shift+x toggle_layout stack

# Focus splits — ctrl+shift+hjkl, vim-style (overrides kitty's default
# ctrl+shift+l next_layout, which is unneeded with only splits+stack enabled)
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
# session-switch-to-next/previous-terminal
map ctrl+tab next_window
map ctrl+shift+tab previous_window

# NEW: per-split title bars (kitty >= 0.47) — every split shows
# "N: title" whenever a tab has 2+ splits. N comes from the {custom} hook
# in window_title_bar.py (deployed next to this file): creation-order
# numbering, so opening new splits never renumbers existing ones (kitty's
# native positional numbering shifts because new splits are inserted next
# to the active one). alt+N below jumps by the same numbering.
window_title_bar_min_windows 2
window_title_template "{fmt.bold}{custom}{fmt.nobold} {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

# NEW: jump straight to split 1..9 — the navigation Ghostty couldn't do.
# pane_jump.py focuses by the same stable creation-order number the title
# bars display (kitty's built-in nth_window is positional and would drift).
# Steals alt+N from shell apps (they see ESC N), same tradeoff Tilix makes.
map alt+1 kitten pane_jump.py 1
map alt+2 kitten pane_jump.py 2
map alt+3 kitten pane_jump.py 3
map alt+4 kitten pane_jump.py 4
map alt+5 kitten pane_jump.py 5
map alt+6 kitten pane_jump.py 6
map alt+7 kitten pane_jump.py 7
map alt+8 kitten pane_jump.py 8
map alt+9 kitten pane_jump.py 9

# Resize splits — Shift+Alt+Arrow (Tilix session-resize-terminal-*), 2 cells
# per step. kitty key names are left/right/up/down (ghostty's arrow_* names
# get silently ignored here).
map shift+alt+left resize_window narrower 2
map shift+alt+right resize_window wider 2
map shift+alt+up resize_window taller 2
map shift+alt+down resize_window shorter 2

# NEW: broadcast — Tilix broadcast-input equivalent. Opens a split that
# mirrors everything typed into it to all kitty windows.
map ctrl+alt+b launch --allow-remote-control kitty +kitten broadcast

# --- Clipboard / selection (kitty defaults, set explicitly for parity) ---
# Mouse: selecting text copies straight to the clipboard (Tilix-style), so
# both ctrl+shift+v and middle-click (kitty default, pastes the selection)
# work without an explicit copy.
copy_on_select yes
# Right-click pastes the clipboard (kitty has no Tilix-style context menu;
# its default right-click extends the selection, which ctrl+right-click
# still does).
mouse_map right press ungrabbed paste_from_clipboard
mouse_map ctrl+right press ungrabbed mouse_selection extend
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection
# (no select_all equivalent — kitty has no such action)

# --- Font zoom ---
# terminal-zoom-in / -out / -normal
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# --- Scrolling ---
# terminal-page-up / -down
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
# terminal-scroll-up / -down (one line)
map ctrl+shift+up scroll_line_up
map ctrl+shift+down scroll_line_down

# --- Window ---
# win-fullscreen
map f11 toggle_fullscreen
