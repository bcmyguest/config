- name: check whether starship is installed
  ansible.builtin.command: starship --version
  register: starship_version
  failed_when: false
  changed_when: false
  check_mode: false

# `--yes` skips the installer's interactive confirmation (would hang with no TTY).
# Runs as root so the binary lands in /usr/local/bin (already on PATH).
- name: install starship using the official install script
  ansible.builtin.shell:
    cmd: curl -sS https://starship.rs/install.sh | sh -s -- --yes
  become: true
  when: starship_version.rc | default(1) != 0

- name: enable starship in shell configuration (bash)
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
    line: 'eval "$(starship init bash)"'
    create: true
