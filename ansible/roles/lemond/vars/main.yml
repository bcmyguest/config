# merged into /var/lib/lemonade/config.json (lemond reads host/port from there, not env)
lemond_settings:
  host: 0.0.0.0

# Suffix Cache Reuse (SCR) for lemond's vLLM recipe: the vllm_scr plugin from the
# clm repo, served through a wrapper set as vllm.rocm_bin. tasks/vllm_scr.yml.
lemond_vllm_scr_enabled: true
lemond_vllm_scr_src: "/home/b/clm/serving/vllm_scr"
# Outside /home: the lemond unit has ProtectHome=yes, so it cannot see /home at all.
lemond_vllm_scr_dir: /opt/vllm-scr
lemond_vllm_bundle: /var/cache/lemonade/bin/vllm/rocm
lemond_hf_hub: /var/lib/lemonade/.cache/huggingface/hub
# HF repo moved from the user's cache into lemond's (same filesystem, so mv is instant).
lemond_vllm_scr_model_repo: QuantTrio/Qwen3.6-35B-A3B-AWQ
lemond_vllm_scr_model_src_hub: "/home/b/.cache/huggingface/hub"
lemond_vllm_scr_model_name: Qwen3.6-35B-A3B-AWQ-SCR
lemond_vllm_scr_user_model:
  checkpoints:
    main: "{{ lemond_vllm_scr_model_repo }}"
  labels: [coding, custom, reasoning, tool-calling]
  recipe: vllm
  size: 25.5
  suggested: true
lemond_vllm_scr_recipe_options:
  ctx_size: 131072
  vllm_backend: rocm
  vllm_args: "--max-num-seqs 4"
  merge_args: true

# Extra settings deep-merged into config.json by tasks/models.yml.
lemond_config_extra:
  # One LLM at a time. Two (ThinkingCoder + Flash-Next, both ctx_size 0 = full native
  # context) overran the 90 GiB GTT on 2026-10-02 21:52 and hung the machine.
  max_loaded_models: 1
  # Patched llama-server (tasks/llamacpp_scr.yml). Stock build for rollback:
  # /opt/llamacpp-unsloth-b10840/llama-server
  # Stock build: the patched one (lemond_llamacpp_scr_dir) crashed under jev-debugger's
  # load on 2026-10-02 23:21 (qsa assert after a forward span move). Patched:
  # "{{ lemond_llamacpp_scr_dir }}/llama-server"
  llamacpp:
    vulkan_bin: /opt/llamacpp-unsloth-b10840/llama-server

lemond_llamacpp_scr_src: /home/b/clm/llamacpp/build/bin/llama-server
lemond_llamacpp_scr_dir: /opt/llamacpp-scr-b10840

# Models registered by tasks/models.yml (name -> user_models entry / recipe options).
lemond_user_models: {}
# Suffix reuse for CLM edits: --cache-reuse N reuses cached chunks of N+ tokens that
# survive an edit; --cache-reuse-hybrid M allows it on hybrid models and prefills the
# last M tokens of each reused span. Existing args kept as they were.
lemond_recipe_options:
  user.Qwen3.8-Flash-Next-GGUF-UD-IQ4_XS:
    ctx_size: 0
    llamacpp_backend: vulkan
    # Rolled back with the stock build (it rejects --cache-reuse-hybrid):
    #   "--cache-reuse 256 --cache-reuse-hybrid 16"
    llamacpp_args: ""
    merge_args: true
  user.Qwen3.6-35B-A3B-ThinkingCoder:
    ctx_size: 0
    llamacpp_backend: vulkan
    llamacpp_args: >-
      --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0.00 --presence-penalty 0 --repeat-penalty 1.0
      --chat-template-kwargs '{"preserve_thinking": true}' -b 1024 -ub 256
    merge_args: true
lemond_pull_models: []
