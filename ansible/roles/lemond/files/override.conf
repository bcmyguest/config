[Service]
# Packaged unit only has Restart=on-failure; a clean-exit crash (backend cascade
# taking the server down with exit 0) would stay dead without this.
Restart=always
# Poll instead of one probe after a fixed sleep: startup (model cache build, HF update
# checks) takes about 3 s, so `sleep 3; curl` raced it and failed the unit.
ExecStartPost=/bin/sh -c 'for i in $(seq 60); do curl -fsS -o /dev/null http://127.0.0.1:13305/ && exit 0; sleep 1; done; exit 1'
