---
# Cross-distro system package layer. Everything OS-specific lives in the
# per-family task and vars files; this file only dispatches on ansible_os_family.
# Static import_tasks + when (not include_tasks with a variable filename) so the
# role tags from the playbook reach every task and --list-tasks/--check see the
# full task list on any distro.
- name: refuse unsupported OS families early
  ansible.builtin.assert:
    that: ansible_os_family in packages_supported_families
    fail_msg: >-
      OS family '{{ ansible_os_family }}' ({{ ansible_distribution }}) is not
      supported by the packages role. Supported families:
      {{ packages_supported_families | join(', ') }}. To extend it, add
      vars/<Family>.yml (package name map) and tasks/<family>.yml (installer).

- name: load OS-family package vars
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

# `ansible <Tab>` needs argcomplete importable by the interpreter ansible itself
# runs under (the pipx venv), not just on PATH: ansible/cli/__init__.py wraps
# `import argcomplete` in a try/except and silently skips autocomplete() when it
# fails, so completions install fine and then return nothing. The distro
# python3-argcomplete package cannot reach into the venv — it only supplies the
# register-python-argcomplete generator the shell-completions role invokes.
- name: ensure argcomplete is available to ansible (shell completion dependency)
  ansible.builtin.pip:
    name: argcomplete
    state: present

- ansible.builtin.import_tasks: debian.yml
  when: ansible_os_family == 'Debian'

- ansible.builtin.import_tasks: redhat.yml
  when: ansible_os_family == 'RedHat'

- ansible.builtin.import_tasks: archlinux.yml
  when: ansible_os_family == 'Archlinux'
