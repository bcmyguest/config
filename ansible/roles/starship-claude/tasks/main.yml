---
# starship-claude renders the Claude Code statusline through starship. Parts:
# the statusline script (~/.local/bin/starship-claude), the starship config it reads
# (~/.claude/starship.toml), the statusLine key in Claude's settings.json that points
# at the script, and a vendored copy of the plugin's toolkit (configure.sh + templates)
# at ~/.claude/starship-claude/ so the statusline can be reconfigured without plugin
# access. The script and toml are vendored in files/ because they carry a local
# customisation (the context segment shows exact context tokens, not a percent) that
# upstream does not have — re-fetching from upstream would drop it.

- name: ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: install the starship-claude statusline script
  ansible.builtin.copy:
    src: starship-claude
    dest: "{{ ansible_env.HOME }}/.local/bin/starship-claude"
    mode: "0755"

- name: ensure ~/.claude exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0755"

# Vendored plugin toolkit (configure.sh + templates) so /starship's reconfigure flow
# works even on a machine with no plugin access. configure.sh derives its PLUGIN_ROOT
# as the parent of its own bin/ dir, so this lays out as a self-contained tree:
#   ~/.claude/starship-claude/{bin/configure.sh, templates/...}
# Run it standalone, e.g.:
#   ~/.claude/starship-claude/bin/configure.sh --nerdfont --style powerline \
#     --palette catppuccin_mocha --write
- name: install the starship-claude reconfigure toolkit (configure.sh + templates)
  ansible.builtin.copy:
    src: toolkit/
    dest: "{{ ansible_env.HOME }}/.claude/starship-claude/"
    mode: "0755"

# configure.sh expects PLUGIN_ROOT/bin/starship-claude to exist (preview/compare
# rendering). Use the customised script so previews match what actually renders.
- name: place the statusline script inside the toolkit bin
  ansible.builtin.copy:
    src: starship-claude
    dest: "{{ ansible_env.HOME }}/.claude/starship-claude/bin/starship-claude"
    mode: "0755"

# The starship.toml itself: when Claude Code is installed, (re)generate it through the
# vendored toolkit so it always tracks the current templates (which now render exact
# context tokens). Render to a temp file then copy, so the step stays idempotent — no
# churn when the output is unchanged. With no Claude CLI present, fall back to the
# vendored config so the file still exists.
- name: detect the Claude Code CLI
  ansible.builtin.shell: command -v claude
  register: starship_claude_cli
  changed_when: false
  failed_when: false

- name: generate starship.toml via the toolkit (Claude installed)
  when: starship_claude_cli.rc == 0
  block:
    - name: render starship.toml to a temp file
      ansible.builtin.command:
        argv:
          - "{{ ansible_env.HOME }}/.claude/starship-claude/bin/configure.sh"
          - --nerdfont
          - --style
          - "{{ starship_claude_style }}"
          - --palette
          - "{{ starship_claude_palette }}"
          - --write
          - "{{ starship_claude_render_tmp }}"
      changed_when: false

    - name: install the generated starship.toml
      ansible.builtin.copy:
        src: "{{ starship_claude_render_tmp }}"
        dest: "{{ ansible_env.HOME }}/.claude/starship.toml"
        remote_src: true
        mode: "0644"

    - name: remove the temp render
      ansible.builtin.file:
        path: "{{ starship_claude_render_tmp }}"
        state: absent

- name: install the vendored starship.toml (Claude not installed)
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_env.HOME }}/.claude/starship.toml"
    mode: "0644"
  when: starship_claude_cli.rc != 0

# Merge our keys into settings.json, preserving every other key. Read the live file
# at run time (slurp), merge, write back — so a re-provision never clobbers whatever
# Claude Code has written there (model, hooks, other plugins, ...). The merge is
# `recursive=True` so registering our marketplace/plugin adds to the existing
# extraKnownMarketplaces and enabledPlugins maps rather than replacing them.
- name: read existing Claude settings.json
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.claude/settings.json"
  register: claude_settings_raw
  failed_when: false

- name: register the plugin and point the statusLine at starship-claude
  ansible.builtin.copy:
    content: >-
      {{
        (
          (claude_settings_raw.content | b64decode | from_json)
          if claude_settings_raw.content is defined else {}
        )
        | combine(starship_claude_settings_patch, recursive=True)
        | to_nice_json(indent=2)
      }}
    dest: "{{ ansible_env.HOME }}/.claude/settings.json"
    mode: "0644"
