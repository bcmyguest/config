---
# starship-claude renders the Claude Code statusline through starship. Three parts:
# the statusline script (~/.local/bin/starship-claude), the starship config it reads
# (~/.claude/starship.toml), and the statusLine key in Claude's settings.json that
# points at the script. The script and toml are vendored in files/ because they carry
# a local customisation (the context segment shows exact context tokens, not a percent)
# that upstream does not have — re-fetching from upstream would drop it.

- name: ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
    mode: "0755"

- name: install the starship-claude statusline script
  ansible.builtin.copy:
    src: starship-claude
    dest: "{{ ansible_env.HOME }}/.local/bin/starship-claude"
    mode: "0755"

- name: ensure ~/.claude exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.claude"
    state: directory
    mode: "0755"

- name: install the starship-claude config (powerline / catppuccin_mocha, exact tokens)
  ansible.builtin.copy:
    src: starship.toml
    dest: "{{ ansible_env.HOME }}/.claude/starship.toml"
    mode: "0644"

# Merge our keys into settings.json, preserving every other key. Read the live file
# at run time (slurp), merge, write back — so a re-provision never clobbers whatever
# Claude Code has written there (model, hooks, other plugins, ...). The merge is
# `recursive=True` so registering our marketplace/plugin adds to the existing
# extraKnownMarketplaces and enabledPlugins maps rather than replacing them.
- name: read existing Claude settings.json
  ansible.builtin.slurp:
    src: "{{ ansible_env.HOME }}/.claude/settings.json"
  register: claude_settings_raw
  failed_when: false

- name: register the plugin and point the statusLine at starship-claude
  ansible.builtin.copy:
    content: >-
      {{
        (
          (claude_settings_raw.content | b64decode | from_json)
          if claude_settings_raw.content is defined else {}
        )
        | combine(starship_claude_settings_patch, recursive=True)
        | to_nice_json(indent=2)
      }}
    dest: "{{ ansible_env.HOME }}/.claude/settings.json"
    mode: "0644"
